# The client (SPA) plus the same proxies the Vite dev server sets up (packages/client/vite.config.ts).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://server:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /colyseus/ {
    proxy_pass http://server:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  # NPC voice talk: llama.cpp's OpenAI-compatible server; streamed replies must not be buffered
  location /voice/llm/ {
    proxy_pass http://llm:8080/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
