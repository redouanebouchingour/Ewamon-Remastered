# nginx in front of the Vite dev server (`client`, docker-compose.yml): one origin on :8080 for the page, its HMR socket
# (the WebSocket upgrade on `/`), the REST API, the game socket and the NPC LLM.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://server:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /colyseus/ {
    proxy_pass http://server:2567/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /npc/llm/ {
    proxy_pass http://llm:8080/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://client:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
