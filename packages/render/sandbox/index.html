<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@ewa/render sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; color: #d8dde3; font: 13px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
      #hud { position: fixed; left: 12px; top: 10px; padding: 8px 10px; background: rgba(8, 10, 14, 0.72); border-radius: 6px; white-space: pre; pointer-events: none; }
      #err { position: fixed; inset: auto 12px 12px 12px; color: #ffb4a8; white-space: pre-wrap; }
      #controls { position: fixed; right: 12px; top: 10px; display: flex; flex-direction: column; gap: 6px; background: rgba(8, 10, 14, 0.72); padding: 8px 10px; border-radius: 6px; }
      #controls label { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">starting…</div>
    <div id="controls">
      <label>time <input id="time" type="range" min="0" max="24" step="0.1" value="10" /></label>
      <label>reduced effects <input id="reduced" type="checkbox" /></label>
      <label>harvest <select id="harvest"><option value="0">0 intact</option><option value="1">1 thinning</option><option value="2">2 harvested</option></select></label>
      <label>weather <select id="weather"><option>none</option><option>sun</option><option>rain</option><option>sand</option><option>hail</option></select></label>
    </div>
    <div id="err"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
