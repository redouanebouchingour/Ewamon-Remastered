name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    # the tests' database server: each test file creates a scratch database of its own on it (@ewa/persist openScratchDb)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ewa
          POSTGRES_PASSWORD: ewa
          POSTGRES_DB: ewa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ewa -d ewa"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EWA_TEST_DATABASE_URL: postgres://ewa:ewa@localhost:5432/ewa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SPEC change control (§50.7 rule 4)
        run: node scripts/check-spec-changelog.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: No generated output in the index
        run: |
          # packages/content/dist/heightfields/ is committed on purpose (SPEC §3.10 rule 12).
          tracked=$(git ls-files | grep -E '(^|/)(dist|dist-types|node_modules|coverage)/|\.tsbuildinfo$' | grep -v '^packages/content/dist/heightfields/' || true)
          if [ -n "$tracked" ]; then echo "Generated output is tracked:"; echo "$tracked"; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:lint-rules
      - run: pnpm test
      - run: pnpm build
